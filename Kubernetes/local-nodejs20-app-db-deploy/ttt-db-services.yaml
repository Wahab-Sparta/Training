---
#APP SERVICE
apiVersion: v1
kind: Service
metadata:
  name: ttt-svc
  namespace: default
spec:
  ports:
  - nodePort: 30001 # range is 30000-32768
    port: 3000
    targetPort: 3000
  selector:
    app: ttt  # this label connect this service to the deployment
  type: NodePort  # also use LoadBalancer - for local use cluster IP

---
#DATABASE SERVICE
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: default
spec:
  ports:
  - name: database
    port: 27017
    targetPort: 27017
  selector:
    db: mongodb
  type: ClusterIP 